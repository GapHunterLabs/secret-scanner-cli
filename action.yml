name: 'Gap Hunter Labs Secret Scanner'
description: 'Local, offline secret scanning (32 exact credential formats plus a strict name + entropy check) with SARIF output for GitHub code scanning. No network calls.'
author: 'Gap Hunter Labs'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Directory or file to scan, relative to the workspace.'
    required: false
    default: '.'
  fail-on-find:
    description: "Fail this step on findings at the 'fail-on' level. Set to 'false' to report only."
    required: false
    default: 'true'
  fail-on:
    description: "Lowest severity that fails the step: 'all' (default), 'medium', 'high' or 'none'. Ignored when fail-on-find is 'false'."
    required: false
    default: 'all'
  config:
    description: "Path to a .secret-scanner.json configuration, relative to the workspace. Empty: ./.secret-scanner.json is used when it exists."
    required: false
    default: ''
  max-file-size:
    description: 'Skip files larger than this many megabytes (0 = no limit). Empty: the tool default (25).'
    required: false
    default: ''
  upload-sarif:
    description: "Upload results to GitHub Code Scanning via github/codeql-action/upload-sarif. Requires the calling workflow to grant 'security-events: write' and to have Code Scanning available (public repos have this for free; private repos need GitHub Advanced Security)."
    required: false
    default: 'true'

outputs:
  finding-count:
    description: 'Number of findings reported.'
    value: ${{ steps.scan.outputs.finding-count }}
  sarif-file:
    description: 'Path to the generated SARIF file.'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    # Third-party actions are pinned to a full commit SHA, not a tag: a tag can be moved to other code.
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Get secret-scanner-cli
      shell: bash
      # When the action is used at a release tag (`@v0.3.1`) and this tree holds
      # that release's SHA-256 in checksums/, the jar attached to the GitHub
      # Release is downloaded and checked against it: no Gradle build. A hash
      # that does not match stops the step; it never falls back to a build, since
      # a different file is exactly what the check exists to catch. Any other ref
      # (a branch, a commit SHA, `uses: ./`), an older tag without a checksum, or
      # a download that fails for network reasons builds from source as before.
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -eo pipefail
        cd "$ACTION_PATH"
        mkdir -p build/libs
        VERSION=""
        if [[ "$ACTION_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then VERSION="${BASH_REMATCH[1]}"; fi
        SUM="checksums/secret-scanner-cli-$VERSION.jar.sha256"
        if [ -n "$VERSION" ] && [ -f "$SUM" ]; then
          JAR="secret-scanner-cli-$VERSION.jar"
          URL="https://github.com/GapHunterLabs/secret-scanner-cli/releases/download/v$VERSION/$JAR"
          if curl -fsSL --retry 3 --retry-delay 2 -o "build/libs/$JAR" "$URL"; then
            (cd build/libs && sha256sum -c "$ACTION_PATH/$SUM") || {
              echo "::error::the downloaded $JAR does not match $SUM; refusing to run it"
              rm -f "build/libs/$JAR"
              exit 1
            }
            echo "secret-scanner-cli: using the v$VERSION release jar (SHA-256 checked)"
            exit 0
          fi
          echo "::warning::could not download the v$VERSION release jar; building from source instead"
          rm -f "build/libs/$JAR"
        fi
        chmod +x ./gradlew
        ./gradlew shadowJar --console=plain -q

    - name: Run scan
      id: scan
      shell: bash
      # Every input reaches the script through an environment variable, never
      # through `${{ }}` expansion inside the script text: an expanded value is
      # pasted into the script before bash parses it, so a path containing `"`
      # or `$(...)` would run as shell code. Each value is checked before use.
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON_FIND: ${{ inputs.fail-on-find }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG_PATH: ${{ inputs.config }}
        MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -eo pipefail
        # Anything other than true/false (any case) fails the step instead of
        # quietly meaning "do not fail", which is what 'True' or 'yes' did.
        case "$(printf '%s' "$FAIL_ON_FIND" | tr '[:upper:]' '[:lower:]')" in
          true) FAIL=1 ;;
          false) FAIL=0 ;;
          *) echo "::error::fail-on-find must be 'true' or 'false'"; exit 2 ;;
        esac
        case "$FAIL_ON" in
          all|medium|high|none) ;;
          *) echo "::error::fail-on must be one of all, medium, high, none"; exit 2 ;;
        esac
        ARGS=("$SCAN_PATH" --no-banner)
        if [ -n "$CONFIG_PATH" ]; then ARGS+=(--config "$CONFIG_PATH"); fi
        if [ -n "$MAX_FILE_SIZE" ]; then
          case "$MAX_FILE_SIZE" in
            ''|*[!0-9]*) echo "::error::max-file-size must be a whole number of megabytes"; exit 2 ;;
          esac
          ARGS+=(--max-file-size "$MAX_FILE_SIZE")
        fi
        JAR=$(ls "$ACTION_PATH"/build/libs/secret-scanner-cli-*.jar | head -n1)
        SARIF_PATH="secret-scanner-results.sarif"
        # The tool's output carries file names from the repository. A name that
        # starts with `::` would otherwise be read by the runner as a workflow
        # command (`::add-mask::`, `::error::`...): commands are switched off
        # around everything the tool prints, with a token nobody can predict.
        STOP_TOKEN="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        # Commands come back on every way out of this script, including an early exit.
        resume_commands() { if [ -n "$STOP_TOKEN" ]; then echo "::$STOP_TOKEN::"; STOP_TOKEN=""; fi; }
        trap resume_commands EXIT
        echo "::stop-commands::$STOP_TOKEN"
        RC=0
        java -jar "$JAR" "${ARGS[@]}" --format sarif --out "$SARIF_PATH" --no-fail || RC=$?
        if [ "$RC" -ne 0 ]; then
          resume_commands
          echo "::error::secret-scanner-cli stopped with exit code $RC before scanning (see the message above)"
          exit "$RC"
        fi
        COUNT=$(jq '.runs[0].properties.findings // (.runs[0].results | length)' "$SARIF_PATH")
        if [ "$COUNT" -gt 0 ]; then
          if [ "$FAIL" = "1" ]; then
            java -jar "$JAR" "${ARGS[@]}" --fail-on "$FAIL_ON" || RC=$?
          else
            java -jar "$JAR" "${ARGS[@]}" --no-fail || RC=$?
          fi
        fi
        resume_commands
        echo "finding-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$SARIF_PATH" >> "$GITHUB_OUTPUT"
        echo "secret-scanner-cli: $COUNT finding(s)"
        if [ "$RC" -eq 1 ]; then
          echo "::error::secret-scanner-cli found $COUNT potential secret(s) at or above '$FAIL_ON' -- see the log above or the uploaded SARIF report."
          exit 1
        fi
        if [ "$RC" -ne 0 ]; then
          echo "::error::secret-scanner-cli stopped with exit code $RC (see the message above)"
          exit "$RC"
        fi

    - name: Upload SARIF to Code Scanning
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3.39.5
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
