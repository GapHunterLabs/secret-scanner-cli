name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            build/reports
            build/libs
          if-no-files-found: ignore

  self-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Scan this repo with itself
        uses: ./
        with:
          path: '.'
          fail-on-find: 'true'
          upload-sarif: 'false'
