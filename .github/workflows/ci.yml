name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            build/reports
            build/libs
          if-no-files-found: ignore

  self-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Scan this repo with itself
        uses: ./
        with:
          # src/main only, deliberately -- src/test is full of
          # intentionally secret-shaped fixtures by design (that's the
          # whole point of ScannerTest.kt), so scanning it here would
          # flag test data, not a real leak. A real consumer's own repo
          # doesn't have that caveat, which is why the action's default
          # (documented in README.md) stays '.', not 'src/main'.
          path: 'src/main'
          fail-on-find: 'true'
          upload-sarif: 'false'
